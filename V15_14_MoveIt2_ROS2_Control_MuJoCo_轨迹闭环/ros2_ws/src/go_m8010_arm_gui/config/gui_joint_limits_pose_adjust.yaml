# 仅供 V15.30E 纯 MuJoCo 调姿窗口使用，不得用于真机运动。
# GUI 输入为 SESSION_REFERENCE_V1 相对角；以下端点由冻结的
# V15.13 CAD/MuJoCo 绝对关节限位减去当前竖直会话模型锚点
# [0, 90, -14.40, 13.49, 47.94, 0] 度得到；端点未做静态内缩。
单位: 度
参考: SESSION_REFERENCE_V1
J1: [-180.0, 180.0]       # 历史定义为 continuous；调姿界面显示一整圈
J2: [-260.0, 80.0]        # 绝对角 -170 .. +170
J3: [-155.6, 184.4]       # 绝对角 -170 .. +170
J4: [-129.49, 145.51]     # 绝对角 -116 .. +159
J5: [-118.54, 103.26]     # 绝对角 -70.6 .. +151.2
J6: [-180.0, 180.0]       # 绝对角 -180 .. +180
