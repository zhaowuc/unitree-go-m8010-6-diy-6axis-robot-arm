# 仅供 V15.30E 纯 MuJoCo 调姿窗口使用，不得用于真机运动。
# GUI 输入为 SESSION_REFERENCE_V1 相对角；以下端点由冻结的 V15.13
# CAD/MuJoCo 绝对关节限位减去会话基准 [0, 170, -170, -12.41, 46.7, 0.55] 得到。
单位: 度
参考: SESSION_REFERENCE_V1
J1: [-180.0, 180.0]       # 历史定义为 continuous；调姿界面显示一整圈
J2: [-340.0, 0.0]         # 绝对角 -170 .. +170
J3: [0.0, 340.0]          # 绝对角 -170 .. +170
J4: [-103.59, 171.41]     # 绝对角 -116 .. +159
J5: [-117.3, 104.5]       # 绝对角 -70.6 .. +151.2
J6: [-180.55, 179.45]     # 绝对角 -180 .. +180
